[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wled-mcp"
version = "0.1.0"
description = "MCP server for controlling WLED devices"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.25.0",
    "anyio>=3.0.0",
    "pyyaml>=6.0"
]

[project.scripts]
wled-mcp = "wled_mcp.server:main"